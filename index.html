<style>
html { -webkit-text-size-adjust: 100%; }
body {
  background: #020715;
  color: #ffffff;
  font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;

/* The signature VEYLORA gradient.
   Previously `background-attachment: fixed` on <body>, which forces a full-page
   repaint on every scroll frame (and is emulated very badly on mobile Safari).
   A fixed pseudo-element is pixel-identical but composites for free. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(180deg, #020715 0%, #051329 35%, #0b264b 65%, #007bb8 88%, #00b8e6 100%) no-repeat;
}
#root { min-height: 100vh; }
::selection { background: white; color: #122e58; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #020715; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

/* Fixed header must not cover the section you just jumped to. */
section[id], div[id] { scroll-margin-top: 88px; }

/* Media elements never participate in layout shifts. */
video { display: block; background-color: transparent; }
</style>

<link rel="stylesheet" href="./assets/blackgrid.css" />

<style>
/* ─── Adaptive performance layer ───────────────────────────────────────────
   Desktop keeps the original values. Mobile keeps the same design language
   with cheaper GPU work. Nothing is hidden; only cost is reduced.          */

/* Real viewport units: stops the 100vh layout jump when mobile browser
   chrome collapses, which otherwise re-lays-out every sticky section. */
@supports (height: 100dvh) {
  @media (max-width: 900px) {
    .h-screen { height: 100dvh; }
    .min-h-screen { min-height: 100dvh; }
    body, #root { min-height: 100dvh; }
  }
}

@media (max-width: 900px) {
  /* A 24px backdrop-filter pinned over a playing video is re-blurred every
     composited frame. 10px reads the same at phone size for ~a third the cost. */
  .bg-header {
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    background-color: rgba(2, 6, 23, 0.78);
  }
  /* Skip rendering work for long static sections while they are far offscreen. */
  #services, #faq {
    content-visibility: auto;
    contain-intrinsic-size: auto 1400px;
  }
}

/* Honour the OS-level motion preference. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
